[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qr-scrabber"
version = "0.1.0"
description = "Glow and Glare brand barcode & GS1 Digital Link QR catalog pipeline"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=4.9",
  "pydantic>=2.6",
  "rapidfuzz>=3.6",
  "segno>=1.6",
  "pyzbar>=0.1.9",
  "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
  "playwright>=1.42",
]

[project.scripts]
qr-scrabber = "qr_scrabber.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qr_scrabber"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
